<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunday Book Club</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<header>
<h1>Sunday Book Club</h1>
<p>One book a month, good snacks and no pressure.</p>
</header>

<nav>
<a href="#about">About</a>
<a href="#schedule">Schedule</a>
<a href="#join">Join</a>
</nav>

<main>

<section id="about" class="box">
<h2>About Our Club</h2>
<p>We read one book every month and share our ideas.</p>
</section>

<section id="schedule" class="box">
<h2>Our Schedule</h2>
<p>We meet every Sunday at 3 PM.</p>
</section>

<section id="join" class="box">
<h2>Join Our Club</h2>
<p>Everyone is welcome to join our reading club!</p>

<form>
<label for="name">Your name</label>
<input type="text" id="name" name="name" required>

<label for="email">Email</label>
<input type="email" id="email" name="email" placeholder="you@example.com" required>

<label for="interest">What interests you about our club?</label>
<select id="interest" name="interest">
<option value="books">Book discussions</option>
<option value="recommendations">Book recommendations</option>
<option value="community">Meeting other readers</option>
</select>

<label for="message">Anything we should know?</label>
<textarea id="message" name="message" rows="4"></textarea>

<button type="submit">Sign me up</button>
</form>
</section>

</main>

<footer>
<p>Made by Alexandra</p>
</footer>

<script src="script.js"></script>
</body>
</html>
